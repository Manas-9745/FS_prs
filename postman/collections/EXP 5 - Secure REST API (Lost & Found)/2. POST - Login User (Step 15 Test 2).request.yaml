$kind: http-request
description: "Step 15 Test 2: Login with email and password to receive JWT token."
url: "{{base_url}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "student@gmail.com",
      "password": "student123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test('Login successful and JWT token returned', function () {
          pm.expect(jsonData.message).to.eql('Login successful');
          pm.expect(jsonData.token).to.exist;
      });
      pm.collectionVariables.set('jwt_token', jsonData.token);
      console.log('Saved JWT Token:', jsonData.token);
    language: text/javascript
order: 2000
