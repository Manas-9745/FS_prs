$kind: http-request
name: "4. POST - Security Case 1: Wrong Password"
description: "Step 16 Case 1: Attempt login with invalid password."
url: "{{base_url}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "student@gmail.com",
      "password": "wrong123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
      var jsonData = pm.response.json();
      pm.test('Error message is Invalid email or password', function () {
          pm.expect(jsonData.message).to.eql('Invalid email or password');
      });
    language: text/javascript
order: 4000
