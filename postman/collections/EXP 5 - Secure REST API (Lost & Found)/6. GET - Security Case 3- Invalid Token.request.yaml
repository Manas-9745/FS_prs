$kind: http-request
name: "6. GET - Security Case 3: Invalid Token"
description: "Step 16 Case 3: Access protected route with invalid/tampered token."
url: "{{base_url}}/api/users/profile"
method: GET
headers:
  Authorization: "{{bearer_token_14hn}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
      var jsonData = pm.response.json();
      pm.test('Error message is Invalid or expired token', function () {
          pm.expect(jsonData.message).to.eql('Invalid or expired token');
      });
    language: text/javascript
order: 6000
