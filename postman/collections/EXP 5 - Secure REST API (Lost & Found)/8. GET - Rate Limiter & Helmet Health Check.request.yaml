$kind: http-request
description: Base route to verify express-rate-limit headers and Helmet security headers.
url: "{{base_url}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Security rate limit header present', function () {
          pm.expect(pm.response.headers.has('RateLimit-Limit') || pm.response.headers.has('x-ratelimit-limit')).to.be.true;
      });
    language: text/javascript
order: 8000
