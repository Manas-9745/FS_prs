services:
  backend:
    build: ./backend
    container_name: lostnfound-backend-1
    ports:
      - "5001:5000"
    restart: unless-stopped
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: lostnfound-frontend-1
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
